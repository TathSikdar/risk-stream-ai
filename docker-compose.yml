services:
  # 1. AI Engine (Python/LangGraph)
  ai_engine:
    build: ./ai_engine
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./ai_engine:/app
      - /app/venv

  # 2. Backend BFF (Node.js)
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - DATABASE_URL=/app/database/risk_stream_ai.db
      - AI_ENGINE_URL=http://ai_engine:8000
    depends_on:
      - ai_engine
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/app/database

  # 3. Frontend (React/Vite)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000" # Senior SWE: Match Vite's internal port
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
